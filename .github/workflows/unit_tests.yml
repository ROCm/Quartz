name: Unit Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install python deps
        run: pip install -r requirements.txt -r requirements-test.txt
      # Tests self-bootstrap sys.path (SCRIPT_DIR pattern), so a single pytest
      # run from the repo root exercises every suite under scripts/ and docs/.
      - name: Run unit tests
        run: python -m pytest scripts docs
