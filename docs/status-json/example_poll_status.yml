# Example: poll Quartz status.json for the latest ROCm nightly and act on it.
#
# Copy this into your downstream project's .github/workflows/ and adapt the
# "React to the build" step. No GitHub App or credentials are required to read
# status.json - it is a public file.
#
# What it does:
#   - Runs hourly during the UTC window when the ROCm release lands (and can be
#     triggered manually from the Actions tab).
#   - Runs example_consume_status.py, which fetches release-nightly/latest.json,
#     gates on the Linux ROCm build, and reports the wheels and a tarball for it.
#     The script sets step outputs (ready / rocm_version / build_date).
#   - Deduplicates with actions/cache keyed on (rocm_version, build_date), so the
#     "React to the build" step runs only when ready == true AND this exact build
#     has not been reacted to before. The marker is saved only after React
#     succeeds, so a failed run retries on the next poll.
#   - Can be dispatched manually with force=true to re-run React on a build that
#     was already processed (a flaky result, or a re-test after a fix).
#
# Both scripts come from the Quartz repository and use only the Python standard
# library - nothing to install. Copy them into your own repository preserving
# the scripts/consumer/ layout:
#   scripts/consumer/read_status_json.py       (the read helper)
#   scripts/consumer/example_consume_status.py (this example's entry point)
# example_consume_status.py imports read_status_json.py from that same directory.

name: Poll ROCm nightly status

on:
  schedule:
    # At :17 past each hour from 5am - 7pm UTC. The ROCm multi-arch release
    # finishes somewhere in this window, so polling only here (not around the
    # clock) is plenty.
    - cron: "17 5-19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run React even if this build was already processed."
        type: boolean
        default: false

permissions:
  contents: read

# Run one poll at a time (scheduled and manual runs) and let an in-flight run
# finish. This is why the save-after marker below is enough: React always
# finishes and writes its marker before the next run starts, so no build is
# processed twice, even when React is slower than the poll interval. The group is
# static because build_date is not known yet when concurrency is evaluated.
# This gate only serializes runs of THIS workflow. If React dispatches a separate
# workflow_dispatch (fire-and-forget), that run is independent and NOT covered
# here; see "Dispatching a separate long-running workflow" in tutorial.md.
concurrency:
  group: poll-rocm-nightly
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository running this workflow
        # Needed so your copy of the scripts/consumer/ scripts is on the runner.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Consume and install the latest nightly (if not already processed)
        id: status
        # Sets outputs ready / rocm_version / build_date (see the script).
        run: python3 scripts/consumer/example_consume_status.py

      # Deduplicate across runs without any external state store. The cache is
      # keyed on the exact (rocm_version, build_date) of this build, so a hit
      # means a previous run already reacted to it. restore is lookup-only (no
      # download) and only probes; the save below writes the marker. This is the
      # workflow-side counterpart to should_process() in the Python script - use
      # whichever fits; you do not need both.
      - name: Check whether this build was already processed
        id: marker
        if: steps.status.outputs.ready == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .rocm-tested
          key: rocm-tested-${{ steps.status.outputs.rocm_version }}-${{ steps.status.outputs.build_date }}
          lookup-only: true

      # >>> Replace this with your project's real work. <<<
      # Runs only when the build you depend on passed the gate AND this exact
      # build has not been processed before. For example: build against the new
      # ROCm version, run a smoke test, or dispatch another workflow that opens a
      # PR bumping your ROCm pin.
      # A manual run with force=true bypasses the already-processed marker to
      # re-run a build on purpose (a flaky result, or re-testing after a fix).
      #
      # Doing the work INLINE (as below) vs. triggering a SEPARATE workflow: the
      # concurrency group above only serializes runs of THIS workflow. If React
      # dispatches another workflow (e.g. `gh workflow run my_build.yml`), that
      # dispatch returns immediately and my_build.yml becomes its own independent
      # run. This job does NOT wait for it: the moment React returns, the poll run
      # ends and the concurrency lane frees for the next queued poll, even while
      # my_build.yml is still running. Two consequences to design around:
      #   - React "success" then means "dispatch accepted", not "build passed",
      #     so the marker below is written even if my_build.yml later fails - the
      #     build is not retried. To keep the marker meaningful, wait for the
      #     dispatched run before it.
      #   - The serialization from concurrency does not extend to my_build.yml.
      # Simplest fix: keep the work in THIS run - inline steps, or a reusable
      # workflow called as a job with `uses:` - so React's outcome reflects the
      # real result and the marker below stays honest. If you must fire-and-forget
      # a separate workflow via workflow-dispatch, move the done-marker INTO that workflow
      # (only it knows the true outcome) and key its concurrency per build. See
      # "Dispatching a separate long-running workflow" in tutorial.md.
      - name: React to the build
        id: react
        if: steps.status.outputs.ready == 'true' && (inputs.force || steps.marker.outputs.cache-hit != 'true')
        run: |
          echo "ROCm ${{ steps.status.outputs.rocm_version }} (${{ steps.status.outputs.build_date }}) is ready."
          echo "Add your downstream build/test step here."

      # Record this build as processed only after React succeeded, so a failed
      # run is retried on the next poll instead of being marked done. The cache
      # is immutable and matched exactly, so this key is written once per build.
      - name: Mark this build as processed
        if: steps.react.outcome == 'success'
        run: touch .rocm-tested

      - name: Save the processed marker
        if: steps.react.outcome == 'success'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .rocm-tested
          key: rocm-tested-${{ steps.status.outputs.rocm_version }}-${{ steps.status.outputs.build_date }}
