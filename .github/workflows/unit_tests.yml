name: Unit Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install python deps
        run: pip install -r requirements.txt -r requirements-test.txt
      # Tests self-bootstrap sys.path (SCRIPT_DIR pattern), so a single pytest
      # run from the repo root exercises every suite under scripts/ and docs/.
      - name: Run unit tests
        run: python -m pytest scripts docs
