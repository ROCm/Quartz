#
# bandit configuration for Quartz, picked up by the rocm-security-gh
# reusable scanner (.github/workflows/security_scan_pr.yml and
# security_scan_weekly.yml) in place of its own org-wide default.
# Reference: https://bandit.readthedocs.io/en/latest/config.html

exclude_dirs:
  - .git
  - .venv
  - venv
  - release-nightly
  - prerelease
  - nightly

# `assert` is pytest's assertion mechanism, so B101 ("assert used") is pure
# noise in test files. Skip it there only; B101 still fires on production code,
# where asserts are stripped under `python -O` and must not be used as guards.
assert_used:
  skips:
    - "*/tests/*"
    - "*_test.py"
