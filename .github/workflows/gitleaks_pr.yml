name: Gitleaks for PRs

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Scan commits introduced by this PR (`scan_mode: changed`). CSV report
  # is uploaded as a build artifact and printed to the job summary so
  # reviewers can browse findings directly from the PR's Checks tab.
  gitleaks:
    uses: ./.github/workflows/_security_scan.yml
    with:
      tool: gitleaks
      tool_repo: ROCm/TheRock
      script_path: build_tools/scan_tools/github_actions/gitleaks.py
      config_path: gitleaks.toml
      scan_mode: changed
      report_formats: csv
